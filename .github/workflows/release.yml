# Release: builds, publishes, attests and signs the three images
#   ghcr.io/pippinmole/upkeep-agent, -server, -web
# from a vX.Y.Z tag on main. See docs/RELEASING.md.
#
# Dry run (pull requests touching this file, a Dockerfile or the pin
# script, and manual runs): the same multi-arch builds with SBOM and
# provenance generated, but nothing is pushed or signed, and the job has
# no write permissions at all.
#
# Every action is pinned to a full commit SHA (looked up 2026-09-29 from
# each repo's latest release); the comment is the release it resolves to.
name: release

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - agent/Dockerfile
      - server/Dockerfile
      - web/Dockerfile
      - scripts/check-version-pins.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a real release half-way; superseded PR dry runs can go.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard:
    name: Check tag and version pins
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and all branches, for the reachable-from-main check.
          fetch-depth: 0

      - id: check
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != push ] || [[ "$REF" != refs/tags/v* ]]; then
            # Dry run: the pins must still agree with each other.
            scripts/check-version-pins.sh
            {
              echo "publish=false"
              echo "version=0.0.0-dryrun.${SHA::7}"
              echo "prerelease=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $REF_NAME is not vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi
          version="${REF_NAME#v}"

          # Images are only ever built from commits that went through main.
          if ! git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null; then
            echo "::error::origin/main was not fetched; cannot check the tag"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SHA" refs/remotes/origin/main; then
            echo "::error::Tag $REF_NAME ($SHA) is not reachable from origin/main. Release only from commits merged to main."
            exit 1
          fi

          # A stable release must match the pinned version (the dashboard's
          # install command and the compose example). A pre-release only
          # checks that the pins agree: main never pins a pre-release.
          if [[ "$version" == *-* ]]; then
            prerelease=true
            scripts/check-version-pins.sh
          else
            prerelease=false
            if ! scripts/check-version-pins.sh "$version"; then
              echo "::error::Tag $REF_NAME doesn't match the pinned agent image version. Run scripts/check-version-pins.sh --set $version, merge that to main, and tag the merge commit."
              exit 1
            fi
          fi
          {
            echo "publish=true"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $version (prerelease: $prerelease) from $SHA"

  # Pull requests and manual runs: build everything, push nothing, sign
  # nothing. No write permissions. The multi-arch result (with its SBOM
  # and provenance attestations) goes to a local OCI layout, which the
  # last step checks.
  dry-run:
    name: Dry run (${{ matrix.image }})
    needs: guard
    if: needs.guard.outputs.publish != 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [agent, server, web]
    env:
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Go images cross-compile; QEMU is for the RUN steps of the
      # arm64 runtime stages (apk, adduser) and web's bun build.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/pippinmole/upkeep-${{ matrix.image }}
          flavor: latest=false
          tags: type=sha,prefix=sha-,format=short
          labels: org.opencontainers.image.title=upkeep-${{ matrix.image }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.guard.outputs.version }}
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/oci,tar=false
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Check both platforms and their attestations were built
        env:
          OCI: ${{ runner.temp }}/oci
        run: |
          set -euo pipefail
          index="$(jq -r '.manifests[0].digest' "$OCI/index.json")"
          jq -r '.manifests[] | "\(.annotations["vnd.docker.reference.type"] // "image")\t\(.platform.os)/\(.platform.architecture)\t\(.digest)"' \
            "$OCI/blobs/sha256/${index#sha256:}" | tee manifests.tsv
          images="$(grep -c '^image' manifests.tsv || true)"
          attestations="$(grep -c '^attestation-manifest' manifests.tsv || true)"
          if [ "$images" -ne 2 ] || [ "$attestations" -ne 2 ]; then
            echo "::error::expected 2 platform images and 2 attestation manifests, got $images and $attestations"
            exit 1
          fi

  # Tag pushes only. The one job with write access: push to GHCR with the
  # workflow's GITHUB_TOKEN (no PATs, no secrets), attest, and sign with
  # cosign keyless (GitHub OIDC). `environment: release` lets the owner
  # require an approval before anything is published (docs/RELEASING.md).
  publish:
    name: Publish (${{ matrix.image }})
    needs: guard
    if: needs.guard.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image: [agent, server, web]
    env:
      IMAGE: ghcr.io/pippinmole/upkeep-${{ matrix.image }}
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # X.Y.Z always; X.Y and latest only for stable releases; sha-<short>.
      # metadata-action also sets org.opencontainers.image.source to this
      # repo, which links the GHCR package to it.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.guard.outputs.prerelease == 'false' }}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ needs.guard.outputs.prerelease == 'false' }}
          labels: org.opencontainers.image.title=upkeep-${{ matrix.image }}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ needs.guard.outputs.version }}
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # GitHub's attestation store, pushed to the registry too, so both
      # `gh attestation verify` and registry-side tooling find it.
      # GitHub only offers artifact attestations on public repos (or on
      # GitHub Enterprise Cloud), so this runs when the repo is public, or
      # when the repo variable GH_ATTESTATIONS is 'true'. BuildKit's SBOM
      # and provenance above and the cosign signature below don't depend
      # on it. Storage records only exist for organization-owned repos.
      - if: ${{ !github.event.repository.private || vars.GH_ATTESTATIONS == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      # Sign the pushed digest (never a tag, which can be moved). Keyless:
      # the certificate names this repo, workflow and tag, and goes into
      # the public Rekor transparency log, even while the repo is private.
      - name: Sign with cosign (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### ${IMAGE}"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo "Tags:"
            while IFS= read -r tag; do
              if [ -n "$tag" ]; then echo "- \`${tag}\`"; fi
            done <<< "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
