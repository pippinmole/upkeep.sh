# Production stack for the security-whatnot platform itself (the
# dashboard + API you deploy once, on your own box, e.g. via Dokploy).
# This is separate from agent/docker-compose.example.yml, which is what
# gets deployed on each *monitored* host.
name: upkeep-sh

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a strong password}
      POSTGRES_DB: ${POSTGRES_DB:-security_whatnot}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-swuser}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.20.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    entrypoint: ["migrate", "-path", "/migrations", "-database",
      "postgres://${POSTGRES_USER:-swuser}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-security_whatnot}?sslmode=disable", "up"]
    restart: "no"

  api:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-swuser}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-security_whatnot}?sslmode=disable
      SW_LISTEN_ADDR: ":8080"
    expose:
      - "8080"
    # In Dokploy, point a domain at this service (port 8080) instead of
    # publishing a host port here.

  # Background jobs on River (Postgres-backed queue): OSV advisory sync
  # (hourly incremental, weekly full), CISA KEV + FIRST EPSS (daily), and
  # the matcher trigger. Same image as api; no ports. Needs ~1 GB of free
  # disk in /tmp during a full Ubuntu sync (the all.zip is streamed to disk,
  # not memory). Safe to run more than one replica: River elects a leader
  # for scheduling and syncs are unique jobs.
  worker:
    build:
      context: ./server
    entrypoint: ["/worker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-swuser}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-security_whatnot}?sslmode=disable
      SW_FEED_SYNC_ENABLED: ${SW_FEED_SYNC_ENABLED:-true}
      # Dashboard links in alert and report notifications.
      SW_DASHBOARD_URL: ${PUBLIC_WEB_URL:-}
      # Report emails: the worker POSTs each report to web's internal render
      # route over the compose network (docs/ARCHITECTURE.md "Reports").
      # Same two values as on web below.
      SW_WEB_INTERNAL_URL: ${SW_WEB_INTERNAL_URL:-http://web:3000}
      SW_INTERNAL_RENDER_SECRET: "${SW_INTERNAL_RENDER_SECRET:?generate with 'openssl rand -base64 32'}"

  web:
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-swuser}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-security_whatnot}?sslmode=disable
      NEXT_PUBLIC_API_URL: "${PUBLIC_API_URL:?e.g. https://api.yourdomain.com}"
      # Better Auth. An .env from before Better Auth still works: the old
      # AUTH_SECRET is used when BETTER_AUTH_SECRET is unset.
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-${AUTH_SECRET:?generate BETTER_AUTH_SECRET with 'openssl rand -base64 32'}}"
      BETTER_AUTH_URL: "${PUBLIC_WEB_URL:?e.g. https://yourdomain.com}"
      # Auth requests are only accepted from PUBLIC_WEB_URL's origin. List
      # any other origins serving this app here, comma-separated.
      BETTER_AUTH_TRUSTED_ORIGINS: "${BETTER_AUTH_TRUSTED_ORIGINS:-}"
      # The report render route (/api/internal/render/report) only answers
      # requests addressed to this host, never the public domain, and with
      # the shared secret. Must match the worker's values above.
      SW_WEB_INTERNAL_URL: ${SW_WEB_INTERNAL_URL:-http://web:3000}
      SW_INTERNAL_RENDER_SECRET: "${SW_INTERNAL_RENDER_SECRET:?generate with 'openssl rand -base64 32'}"
    expose:
      - "3000"
    # In Dokploy, point your primary domain at this service (port 3000).

volumes:
  pgdata:
