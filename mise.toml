[tools]
go = "1.27.1"
golangci-lint = "2.13.2"
hadolint = "2.15.1"
hk = "2.0.1"
rumdl = "v0.2.74"
zizmor = "1.30.1"
yamlfmt = "0.21.0"

[settings]
lockfile = true
experimental = true

[env]
HK_MISE = 1

[hooks]
# Automatically install/update hooks when tools are installed
postinstall = "hk install --mise"
