# One-click agent stack for Dokploy / Coolify.
#
# Copy this file into your Dokploy/Coolify compose app, set
# SW_SERVER_URL and SW_ENROLLMENT_TOKEN (from the dashboard's
# "Add host" page), and deploy. The agent needs no inbound ports.
#
# pid: host + network_mode: host let the agent read the REAL host's
# process table and listening sockets (not the container's own).
# /:/host:ro is a read-only bind mount used only for filesystem facts
# (dpkg database, os-release, reboot-required flag) that aren't
# visible through the host namespaces above.
#
# upkeep-agent-data is the agent's persistent data directory (a folder):
# credentials.json and the agent's SSH key for remote hosts (ssh/). Keep
# it across upgrades and container re-creation; losing it means
# re-enrolling and re-adding the SSH key on remote hosts. To use your own
# key instead, mount it read-only and set SW_SSH_KEY_FILE to its path.
services:
  upkeep-agent:
    image: ghcr.io/icondesk/upkeep-agent:latest
    restart: unless-stopped
    pid: host
    network_mode: host
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - /:/host:ro
      - upkeep-agent-data:/var/lib/upkeep
    environment:
      SW_SERVER_URL: "https://your-upkeep-instance.example.com"
      SW_ENROLLMENT_TOKEN: "paste-one-time-token-here"
      SW_INTERVAL: "15m"

volumes:
  upkeep-agent-data:
