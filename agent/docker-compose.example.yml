# One-click agent stack for Dokploy / Coolify.
#
# Copy this file into your Dokploy/Coolify compose app, set
# SW_SERVER_URL and SW_ENROLLMENT_TOKEN (from the dashboard's
# "Add host" page), and deploy. The agent needs no inbound ports.
#
# pid: host + network_mode: host let the agent read the REAL host's
# process table and listening sockets (not the container's own).
#
# The host filesystem is mounted read-only for filesystem facts (dpkg
# database, os-release, systemd units, apt state) that aren't visible
# through the host namespaces above. It is bound in two parts, and the
# split is deliberate — do not replace it with a plain `- /:/host:ro`:
#
#   - The host's / at /host, bound NON-recursively
#     (bind-recursive=disabled). A plain recursive `-v /:/host:ro` also
#     exposes every mount nested under /, including the sockets on the
#     /run tmpfs: /host/run/docker.sock, containerd, systemd's private
#     socket and D-Bus. `:ro` does NOT stop connect() on a socket, so a
#     recursive mount is full Docker/root access to the host whether or
#     not Docker collection (below) is enabled — it makes opting out of
#     Docker meaningless. bind-recursive=disabled carries only the root
#     filesystem, so none of those sockets appear under /host.
#   - The few directories the collectors read that live on a SEPARATE
#     mount are bound one by one, read-only, under /host-extra (NOT
#     inside /host: a mountpoint nested in the read-only /host bind can't
#     be created when its parent is a separate mount). /run is a tmpfs
#     and /var is often its own filesystem, so var/lib/dpkg, var/lib/apt
#     and run/systemd/system are listed explicitly. Never bind /run or
#     /var wholesale: the sockets live directly on /run, and the LXD
#     socket on /var.
#
# The agent's /run/reboot-required flag file sits on the /run tmpfs next
# to the sockets, so it is intentionally NOT mounted; the agent instead
# derives a pending reboot by comparing the running kernel with the
# installed linux-image-* packages (docs/PROTOCOL.md).
#
# Requires Docker Engine 25 or newer (bind-recursive=disabled). On older
# Docker the option is rejected or silently ignored (a recursive mount);
# the agent logs a startup WARN and reports the host_mount collector as
# an error if any host socket is reachable under /host, so upgrade Docker
# or run the agent as a bare-metal systemd service instead.
#
# upkeep-agent-data is the agent's persistent data directory (a folder):
# credentials.json and the agent's SSH key for remote hosts (ssh/). Keep
# it across upgrades and container re-creation; losing it means
# re-enrolling and re-adding the SSH key on remote hosts. To use your own
# key instead, mount it read-only and set SW_SSH_KEY_FILE to its path.
services:
  upkeep-agent:
    image: ghcr.io/pippinmole/upkeep-agent:0.1.0
    restart: unless-stopped
    pid: host
    network_mode: host
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      # The host's / at /host, non-recursively (see the note above).
      - type: bind
        source: /
        target: /host
        read_only: true
        bind:
          recursive: disabled
      # Directories the collectors read that may be on a separate mount,
      # each bound read-only under /host-extra. Keep this list in step
      # with target.ExtraPaths in the agent. create_host_path: false makes
      # a missing source an error instead of Docker silently creating an
      # empty directory on the host (an empty /run/systemd/system would
      # make other software think the host boots with systemd). On a host
      # without dpkg/apt (not Debian/Ubuntu) or without systemd, delete
      # the matching entry; the collector then reports what isn't visible.
      - type: bind
        source: /var/lib/dpkg
        target: /host-extra/var/lib/dpkg
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/apt
        target: /host-extra/var/lib/apt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/systemd/system
        target: /host-extra/run/systemd/system
        read_only: true
        bind:
          create_host_path: false
      - upkeep-agent-data:/var/lib/upkeep
      # Optional: Docker containers and images (off by default).
      #
      # Uncomment the line below to let the agent inventory this host's
      # Docker containers, images, networks and Swarm services. Be aware
      # of what it grants: access to the Docker socket is full Docker API
      # access, which is root-equivalent on this host (anything that can
      # talk to the socket can start a privileged container). There is no
      # read-only mode for a socket, and adding ":ro" doesn't limit it.
      # The agent itself only makes read calls, by design: ping, version,
      # info, container list/inspect, image list/inspect, network list,
      # and on Swarm managers service/task/node list. Never logs, exec,
      # file export, secrets or configs, and never anything that changes
      # state. Environment variables are never sent.
      #
      # The left side is the socket's path on the host:
      #   Docker (rootful):  /var/run/docker.sock
      #   rootless Docker:   $XDG_RUNTIME_DIR/docker.sock,
      #                      e.g. /run/user/1000/docker.sock
      #   Podman (rootful):  /run/podman/podman.sock
      #   Podman (rootless): $XDG_RUNTIME_DIR/podman/podman.sock
      #                      e.g. /run/user/1000/podman/podman.sock
      # Podman serves its Docker-compatible API only while its socket is
      # enabled: `systemctl enable --now podman.socket` (rootful) or
      # `systemctl --user enable --now podman.socket` (rootless).
      # Keep the right side as is, or mount it elsewhere and set
      # SW_DOCKER_SOCKET to that path in the container.
      #
      # Permissions: the agent runs as root (uid 0) in the container but
      # with cap_drop: ALL, so it can't bypass file permissions; it can
      # connect because root owns the usual rootful sockets (rw for the
      # owner). If the socket you mount is owned by another user (e.g. a
      # rootless Docker/Podman socket while this agent runs under a
      # rootful engine), also add the socket's group id, as shown by
      # `stat -c %g <socket>`, e.g.:
      #   group_add: ["1000"]
      #
      # Unlike the /host binds above, this is the one socket the agent is
      # meant to reach: it is mounted at its own path, not under /host, so
      # the startup self-check and the host_mount collector don't flag it.
      # (A future agent-side image scan, Phase 2a, will additionally bind
      # /var/lib/docker and /var/lib/containerd read-only under /host-extra
      # here; not built yet.)
      #
      # - /var/run/docker.sock:/var/run/docker.sock
    environment:
      SW_SERVER_URL: "https://your-upkeep-instance.example.com"
      SW_ENROLLMENT_TOKEN: "paste-one-time-token-here"
      SW_INTERVAL: "15m"

volumes:
  upkeep-agent-data:
