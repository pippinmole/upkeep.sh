name: upkeep-sh-dev

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: swuser
      POSTGRES_PASSWORD: swpass
      POSTGRES_DB: security_whatnot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swuser"]
      interval: 3s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.20.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    entrypoint: ["migrate", "-path", "/migrations", "-database",
      "postgres://swuser:swpass@postgres:5432/security_whatnot?sslmode=disable", "up"]
    restart: "no"

  api:
    build:
      context: ./server
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://swuser:swpass@postgres:5432/security_whatnot?sslmode=disable
      SW_LISTEN_ADDR: ":8080"
    ports:
      - "8080:8080"

  # Background jobs (River): OSV Debian/Ubuntu advisory sync, CISA KEV and
  # FIRST EPSS. Same image as api, different entrypoint. The first start
  # downloads ~870 MB of OSV data and takes a few minutes; set
  # SW_FEED_SYNC_ENABLED=false in your shell to skip scheduled syncs (jobs
  # can still be run by hand: `docker compose -f docker-compose.dev.yml
  # run --rm worker sync osv Debian`).
  worker:
    build:
      context: ./server
    entrypoint: ["/worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://swuser:swpass@postgres:5432/security_whatnot?sslmode=disable
      SW_FEED_SYNC_ENABLED: ${SW_FEED_SYNC_ENABLED:-true}
      SW_DASHBOARD_URL: http://localhost:3000
      # Dev only: lets notification channels reach http:// and private /
      # loopback receivers (docs/WEBHOOKS.md). Set it in web/.env.local too.
      SW_NOTIFY_ALLOW_PRIVATE_NETWORKS: ${SW_NOTIFY_ALLOW_PRIVATE_NETWORKS:-false}
      # Report emails: rendered by the Next.js dev server, which runs on the
      # host (see below), so the worker reaches it through
      # host.docker.internal. web/.env.example (and start-dev's up.sh, for an
      # existing web/.env.local) sets the same two values on the web side.
      # A throwaway secret, like the DB credentials above.
      SW_WEB_INTERNAL_URL: http://host.docker.internal:3000
      SW_INTERNAL_RENDER_SECRET: dev-only-render-secret-not-for-production
    # Docker Desktop resolves host.docker.internal by itself; native Linux
    # Docker needs this.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # `web` is intentionally NOT run here. Turbopack's file watcher does not
  # reliably see changes made to a Windows-path bind mount under Docker
  # Desktop — not even with next.config.ts's `watchOptions.pollIntervalMs`
  # (the documented fix for "native watching doesn't work e.g. docker"),
  # verified by editing a file, confirming the container saw the updated
  # mtime, and getting no recompile. Run the Next.js dev server natively
  # instead: `cd web && bun run dev` (see web/.env.example — it already
  # points at localhost:5432/localhost:8080, i.e. these services' published
  # ports below, which is exactly why this file still runs postgres/api).

volumes:
  pgdata:
